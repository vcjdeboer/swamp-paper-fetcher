[project]
name = "paper-fetcher"
version = "0.2.1"
description = "MCP server: resolve DOIs, fetch PDFs with provenance, read Zotero, extract PDF text"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "pypdf>=4.0",
    "playwright>=1.45",
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]
